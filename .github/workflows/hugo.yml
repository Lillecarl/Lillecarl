name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        # default.nix falls back to <nixpkgs> when /etc/nixpkgs is
        # absent, which is always true on a runner: the action puts
        # the unstable channel on NIX_PATH.
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
        timeout-minutes: 15

      - name: Check and build
        # The spell checks fail the job before anything deploys. The
        # same derivations run locally: `nix build --file . checks`.
        run: |
          nix build --file . checks
          nix build --file . site -o public
        timeout-minutes: 30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
